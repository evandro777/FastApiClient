app-id: io.github.evandro777.FastApiClient
runtime: org.freedesktop.Platform
# Bump together with: the container image tag and the rust-stable lines in .github/workflows/flatpak.yml, and the
# header of flatpak/build.sh.
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fastapiclient

# Wayland when available, otherwise X11; no GPU access (software rendering). An app that needs a global hotkey,
# clipboard watching or synthetic keys is X11-only: use `--socket=x11` instead of the two socket lines. A tray needs
# `--talk-name=org.kde.StatusNotifierWatcher`.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # It is an HTTP client: Send needs the network.
  - --share=network
  # So a typed path (a file body to send, an import or export folder) opens as it does in the AppImage; Browse goes
  # through the portal and does not need it.
  - --filesystem=home
  # The sandbox has no cursor theme, so the resize pointers fall back to the plain arrow. Share the host's themes
  # (read-only) and point the cursor loader at them; /run/host/share is the host's /usr/share.
  - --filesystem=xdg-data/icons:ro
  - --filesystem=~/.icons:ro
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: fastapiclient
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/fastapiclient/cargo
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/fastapiclient ${FLATPAK_DEST}/bin/fastapiclient
      - install -Dm644 packaging/io.github.evandro777.FastApiClient.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/io.github.evandro777.FastApiClient.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 packaging/io.github.evandro777.FastApiClient.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # A development build (app-id ...FastApiClient.Devel) must not collide with an installed release.
      - sed -i "s/io\\.github\\.evandro777\\.FastApiClient/${FLATPAK_ID}/g" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - case "${FLATPAK_ID}" in *.Devel) sed -i "s/^Name=FastApiClient$/Name=FastApiClient (Devel)/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop ;; esac
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - docs/screenshots
          - dev
          - .claude
          - flatpak/build-dir
          - flatpak/devel
          - flatpak/.flatpak-builder
          - flatpak/repo
          - flatpak/vendor
          - flatpak/io.github.evandro777.FastApiClient.Devel.yml
          - flatpak/fastapiclient.flatpak
          - appimage/AppDir
          - squashfs-root
      # Crates are vendored by flatpak/build.sh, because the build runs without network access.
      - type: dir
        path: vendor
        dest: vendor
      - type: file
        path: cargo-config.toml
        dest: .cargo
        dest-filename: config.toml
