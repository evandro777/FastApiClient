[package]
name = "fastapiclient"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Light and fast REST API client built in Rust with Slint."

[dependencies]
fastapiclient-core = { path = "../core" }
serde_json = "1"
roxmltree = "0.21"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
# The file chooser of the import dialog, through the xdg-desktop-portal (works inside the Flatpak). No GTK, no wayland
# parent-window support: the dialog is not modal, which is fine here.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "unstable-winit-030", "unstable-fontique-012"] }

[build-dependencies]
slint-build = "1.19"
